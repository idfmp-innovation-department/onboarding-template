name: Bootstrap onboarding

# Run this once, from the Actions tab of YOUR repository, right after you
# create it from the template. It creates the labels, the milestones and all
# 42 issues. It refuses to run a second time — use "Sync from template" after
# this.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — list what would be created without creating it"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        env:
          TEMPLATE_REPO: idfmp-innovation-department/onboarding-template
          MODE: bootstrap
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          # GITHUB_TOKEN is enough while the template repository is public.
          # If you make it private, create an organization secret named
          # TEMPLATE_TOKEN holding a token with read access to it — the
          # expression below picks it up automatically.
          github-token: ${{ secrets.TEMPLATE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/sync-issues.cjs')
            await run({ github, context, core })
